name: CI

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test, and benchmark
    runs-on: [self-hosted, sylphx, macos, standard]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify static owned runner profiles
        run: bash scripts/check-owned-runner-profiles.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Python benchmark dependencies
        run: python -m pip install -r bench/python-parity/requirements.txt

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Python parity benchmark
        # Functional parity report is required product signal.
        run: bun run bench:python-parity

      - name: Python parity repeatability (informational)
        # Timing variance on shared CI runners is not product correctness.
        # Keep the report artifacted; do not fail tip product CI on flaky ratios.
        continue-on-error: true
        run: bun run bench:python-parity:repeatability

      - name: Native dispatch probe
        run: bun run bench:native-dispatch

      - name: Python parity report freshness
        run: bun run bench:python-parity:report:check

      - name: Upload Python parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-parity-report
          path: |
            bench/python-parity/results/latest.json
            bench/python-parity/results/latest.md
            bench/python-parity/results/repeatability-latest.json
            bench/python-parity/results/repeatability-latest.md
          if-no-files-found: ignore

      - name: Upload native dispatch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-dispatch-report
          path: |
            bench/python-parity/results/native-dispatch-latest.json
            bench/python-parity/results/native-dispatch-latest.md
          if-no-files-found: ignore
